<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Straight Units | lacewigs.com</title>
    <style>
        /* ==========================================================================
           1. GLOBAL STYLES & LUXURY VARIABLES
           ========================================================================== */
        :root {
            --primary-color: #1a1a1a;    /* Rich Luxury Dark Accent */
            --accent-color: #d4af37;     /* Premium Gold tint */
            --text-color: #333333;       /* Soft body text */
            --light-bg: #fdfbf7;         /* Clean background canvas */
            --gray-light: #f4f4f4;       /* Base layout light gray */
            --gray-border: #e5e5e5;      /* Delicate dividers */
            --font-family: 'Playfair Display', 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Announcement Bar */
        .announcement-bar {
            background-color: var(--primary-color);
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* ==========================================================================
           2. HEADER & NAVIGATION STYLES
           ========================================================================== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: #ffffff;
            border-bottom: 1px solid var(--gray-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            text-decoration: none;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .logo span {
            color: var(--accent-color);
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        .nav-actions {
            display: flex;
            gap: 20px;
        }

        .nav-actions a {
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Mobile Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
        }

        .mobile-drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background: #fff;
            z-index: 201;
            padding: 40px 20px;
            transition: left 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .mobile-drawer.active {
            left: 0;
        }

        .drawer-close {
            background: none;
            border: none;
            font-size: 2rem;
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
        }

        .drawer-links {
            list-style: none;
            margin-top: 40px;
        }

        .drawer-links li {
            margin-bottom: 25px;
        }

        .drawer-links a {
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           3. HERO CAROUSEL BANNER
           ========================================================================== */
        .carousel-container {
            width: 100%;
            height: 450px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .carousel-track {
            display: flex;
            width: 300%; /* Spanning 3 slides */
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-caption {
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }

        .carousel-caption h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .carousel-caption p {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        /* ==========================================================================
           4. MAIN COLLECTION CONTROLS & RESPONSE GRID
           ========================================================================== */
        .collection-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--gray-border);
        }

        .product-count {
            font-size: 0.9rem;
            color: #666;
        }

        .sort-select {
            padding: 8px 12px;
            border: 1px solid var(--gray-border);
            background: #fff;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        /* Responsive Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px 20px;
        }

        .product-card {
            position: relative;
            background: #fff;
            transition: transform 0.3s ease;
        }

        .product-image-container {
            position: relative;
            width: 100%;
            padding-top: 125%; /* 4:5 Aspect Ratio for fashion layouts */
            background-color: var(--gray-light);
            overflow: hidden;
            margin-bottom: 15px;
        }

        .product-image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.05);
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent-color);
            color: #000;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .quick-add-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 11, 11, 0.9);
            color: #fff;
            text-align: center;
            padding: 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .product-card:hover .quick-add-btn {
            transform: translateY(0);
        }

        .product-info {
            text-align: left;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: var(--primary-color);
            text-decoration: none;
            display: block;
        }

        .product-title:hover {
            color: var(--accent-color);
        }

        .product-price {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .price-compare {
            text-decoration: line-through;
            color: #999;
            font-weight: 400;
            margin-left: 8px;
            font-size: 0.85rem;
        }

        /* ==========================================================================
           5. MARKETING NEWSLETTER BLOCK
           ========================================================================== */
        .newsletter {
            background: var(--gray-light);
            padding: 80px 5%;
            text-align: center;
