<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silky Straight Collection | THE LACE WIGS</title>
    <!-- Luxury Typography Engine Integration -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CORE LUXURY BRAND VARIABLES (THELACEWIGS.COM THEME)
           ========================================================================== */
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #d4af37;
            --text-color: #333333;
            --light-bg: #fdfbf7;
            --gray-light: #f4f4f4;
            --gray-border: #e5e5e5;
            --font-luxury: 'Playfair Display', serif;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .announcement-bar {
            background-color: var(--primary-color);
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* ==========================================================================
           2. BRAND ALIGNED TOP NAVIGATION HIERARCHY
           ========================================================================== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: #ffffff;
            border-bottom: 1px solid var(--gray-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-luxury);
            font-size: 1.6rem;
            text-decoration: none;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .logo span {
            color: var(--accent-color);
            font-weight: 300;
            margin-left: 2px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        .nav-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-actions a {
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bag-count {
            color: var(--accent-color);
            font-weight: 600;
        }

        /* ==========================================================================
           3. BANNER SLIDER HERO LAYOUT
           ========================================================================== */
        .carousel-container {
            width: 100%;
            height: 380px;
            position: relative;
            overflow: hidden;
            background: #111;
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-caption {
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }

        .carousel-caption h1 {
            font-family: var(--font-luxury);
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .carousel-caption p {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        /* ==========================================================================
           4. PRODUCT GRID AND CARD SYSTEM
           ========================================================================== */
        .collection-wrapper {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--gray-border);
        }

        .product-count {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 50px 20px;
        }

        /* Responsive rows adjust automatically */
        @media (max-width: 1024px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
            .carousel-caption h1 { font-size: 2.5rem; }
        }

        .product-card {
            position: relative;
            background: transparent;
        }

        .product-image-container {
            position: relative;
            width: 100%;
            padding-top: 125%; /* 4:5 Aspect Ratio for Portrait Hair Shots */
            background-color: var(--gray-light);
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--gray-border);
        }

        .product-image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.04);
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent-color);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .badge.hd {
            background: var(--primary-color);
        }

        .quick-add-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 26, 26, 0.95);
            color: #fff;
            text-align: center;
            padding: 14px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .product-card:hover .quick-add-btn {
            transform: translateY(0);
        }

        .product-info {
            text-align: left;
            padding: 5px 0;
        }

        .product-title {
            font-family: var(--font-luxury);
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--primary-color);
            text-decoration: none;
            display: block;
        }

        .product-subtitle {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-price {
            font-weight: 500;
            color: var(--primary-color);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="announcement-bar">
        Free Global Shipping on All Premium Luxury Hair Units
    </div>

    <nav class="navbar">
        <a href="#" class="logo">THE LACE WIGS<span>™</span></a>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Track</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="nav-actions">
            <a href="#">Bag (<span class="bag-count">0</span>)</a>
        </div>
    </nav>

    <header class="carousel-container">
        <div class="carousel-slide">
            <div class="carousel-caption">
                <h1>Silky Straight</h1>
                <p>Signature 100% Premium Virgin Lace Units</p>
            </div>
        </div>
    </header>

    <main class="collection-wrapper">
        <div class="collection-header">
            <span class="product-count">8 Premium Units Available</span>
            <span class="product-count">★★★★★ (42 reviews)</span>
        </div>

        <section class="product-grid">
            
            <!-- Unit 1 -->
